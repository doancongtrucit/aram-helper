# Chạy test ở mỗi lần push / pull request (bản phát hành chạy lại trong release.yml).
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      ARAM_HELPER_DATA: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cài thư viện
        run: python -m pip install -r requirements.txt pyflakes
      - name: Kiểm tra lỗi code
        run: python -m pyflakes src tools
      - name: Tải icon lõi cho test nhận diện
        run: python tests/fetch_icons.py
      - name: Test (báo lỗi nếu quá 2 test bị bỏ qua)
        run: python tools/run_tests.py
