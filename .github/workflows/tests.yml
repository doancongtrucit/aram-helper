# Chạy test ở mỗi lần push / pull request (bản phát hành chạy lại trong release.yml).
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      ARAM_HELPER_DATA: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Cài thư viện
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Kiểm tra lỗi code
        run: python -m pyflakes src tools
      - name: Cache icon lõi
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-data/icons
          key: aug-icons-${{ hashFiles('tests/sample_data.json') }}-${{ github.run_id }}
          restore-keys: aug-icons-
      - name: Tải icon lõi cho test nhận diện
        run: python tests/fetch_icons.py
      - name: Test (báo lỗi nếu quá 2 test bị bỏ qua)
        run: python tools/run_tests.py
