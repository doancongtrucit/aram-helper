<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Aram Helper gaming icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.45" stop-color="#E8B84A"/>
      <stop offset="1" stop-color="#8A5A12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.5" stop-color="#B8801F"/>
      <stop offset="1" stop-color="#FFD76A"/>
    </linearGradient>
    <radialGradient id="field" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3B2A8F"/>
      <stop offset="0.55" stop-color="#16144A"/>
      <stop offset="1" stop-color="#070B26"/>
    </radialGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6FBFF"/>
      <stop offset="1" stop-color="#46C8F0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- outer hex frame -->
  <polygon points="256,24 458,140 458,372 256,488 54,372 54,140" fill="url(#rim)" filter="url(#shadow)"/>
  <polygon points="256,44 440,150 440,362 256,468 72,362 72,150" fill="#2A1B05"/>
  <!-- inner field -->
  <polygon points="256,58 426,158 426,354 256,454 86,354 86,158" fill="url(#field)"/>
  <!-- inner cyan rune line -->
  <polygon points="256,76 410,166 410,346 256,436 102,346 102,166" fill="none" stroke="#46C8F0" stroke-opacity="0.55" stroke-width="3"/>
  <!-- corner studs -->
  <g fill="#FFE08A">
    <circle cx="256" cy="34" r="7"/><circle cx="256" cy="478" r="7"/>
    <circle cx="449" cy="145" r="6"/><circle cx="63" cy="145" r="6"/>
    <circle cx="449" cy="367" r="6"/><circle cx="63" cy="367" r="6"/>
  </g>

  <!-- letter A -->
  <g filter="url(#glow)">
    <path fill-rule="evenodd" fill="url(#gold)" stroke="#5B3A08" stroke-width="5" stroke-linejoin="miter"
      d="M256 110 L356 372 H308 L290 322 H222 L204 372 H156 Z M256 200 L237 276 H275 Z"/>
  </g>
  <!-- blade highlight -->
  <path d="M256 126 L190 300" stroke="#FFFBE6" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- random die -->
  <g transform="translate(372 372) rotate(14)" filter="url(#shadow)">
    <rect x="-44" y="-44" width="88" height="88" rx="18" fill="url(#die)" stroke="#0B3A57" stroke-width="5"/>
    <g fill="#10315A">
      <circle cx="-20" cy="-20" r="7"/><circle cx="20" cy="-20" r="7"/>
      <circle cx="0" cy="0" r="7"/>
      <circle cx="-20" cy="20" r="7"/><circle cx="20" cy="20" r="7"/>
    </g>
  </g>

  <!-- spark -->
  <path d="M148 150 L155 172 L177 179 L155 186 L148 208 L141 186 L119 179 L141 172 Z" fill="#9BE7FF" filter="url(#glow)"/>
</svg>
